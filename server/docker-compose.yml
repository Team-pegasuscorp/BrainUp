services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizz}
      POSTGRES_USER: ${POSTGRES_USER:-quizz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quizz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quizz}
      ## 1 = the battle pass premium unlocks with the test receipt "dev" (development only).
      PASS_DEV_UNLOCK: ${PASS_DEV_UNLOCK:-0}
      ## 1 = the shop also sells the placeholder "demo" avatars (development only).
      SHOP_DEMO_ITEMS: ${SHOP_DEMO_ITEMS:-0}
      ## Google Play Games server auth (OAuth *web* client). Empty = POST /players/play_games
      ## answers 503 until the Play Console credentials are configured.
      GOOGLE_PLAY_WEB_CLIENT_ID: ${GOOGLE_PLAY_WEB_CLIENT_ID:-}
      GOOGLE_PLAY_WEB_CLIENT_SECRET: ${GOOGLE_PLAY_WEB_CLIENT_SECRET:-}
      ## Test only: skips the Google exchange and accepts any auth code as this
      ## Google account id. Never set on a real deployment.
      GOOGLE_AUTH_MOCK_SUB: ${GOOGLE_AUTH_MOCK_SUB:-}
      ## Off by default here: the tools/ suites fire many calls a second. 1 = test the limits.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-0}
      ## Off by default here: the tools/ suites buy fixed items. 1 = see the daily selection.
      SHOP_ROTATION: ${SHOP_ROTATION:-0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
